/* ---------------- data binding ---------------- */
function nodeAt(r, path) {
  let n = r.when;
  if (path === '' || path == null) return n;
  const idx = String(path).split('.').map(Number);
  for (let i = 0; i < idx.length; i++) n = n.children[idx[i]];
  return n;
}
function parentAt(r, path) {
  const idx = String(path).split('.').map(Number);
  const last = idx.pop();
  let n = r.when;
  idx.forEach(i => { n = n.children[i]; });
  return { parent: n, index: last };
}
function resolve(bind) {
  const a = bind.split('|'), p = prof();
  const rule = id => p.rules.find(r => r.id === id);
  switch (a[0]) {
    case 'proj': return { o: project, k: a[1] };
    case 'prof': return { o: p, k: a[1] };
    case 'psetting': return { o: p.settings, k: a[1] };
    case 'raw': return { o: p.raw, k: a[1] };
    case 'set': return { o: p.sets.find(s => s.id === a[1]), k: a[2] };
    case 'item': { const s = p.sets.find(x => x.id === a[1]); return { o: s && s.slots[a[2]], k: a[3] }; }
    case 'rule': return { o: rule(a[1]), k: a[2] };
    case 'grp': return { o: nodeAt(rule(a[1]), a[2]), k: 'op' };
    case 'cond': return { o: nodeAt(rule(a[1]), a[2]), k: a[3] };
    case 'act': return { o: rule(a[1]).actions[Number(a[2])], k: a[3] };
    case 'var': return { o: p.variables.find(v => v.id === a[1]), k: a[2], v: true };
    case 'cmd': return { o: p.commands.find(c => c.id === a[1]), k: a[2] };
  }
  return { o: null };
}
function applyBind(el) {
  const r = resolve(el.dataset.bind);
  if (!r.o) return;
  let val;
  if (el.type === 'checkbox') val = el.checked;
  else if (r.k === 'augments') val = el.value.split('\n').map(x => x.trim()).filter(Boolean);
  else if (r.k === 'options') val = el.value.split(',').map(x => x.trim()).filter(Boolean);
  else if (el.type === 'number') val = el.value === '' ? 0 : Number(el.value);
  else val = el.value;
  r.o[r.k] = val;
  if (r.v && r.k === 'options' && r.o.options.indexOf(r.o.value) < 0) r.o.value = r.o.options[0] || '';
  const cc = el.dataset.bind.split('|');
  if (cc[0] === 'cond' && cc[3] === 'varId') { const v = C.findVar(prof(), val); r.o.value = v ? (v.options[0] || '') : ''; }
  if (cc[0] === 'act' && cc[3] === 'setId') { delete r.o.setName; }
}

/* ---------------- actions ---------------- */
function newSetAction() {
  const p = prof();
  const s = C.newSet(uniqueName('NewSet', p.sets.map(x => x.name)));
  p.sets.push(s); ui.setId = s.id; ui.tab = 'sets'; save(); render();
}
function pickItem(name) {
  const s = curSet(); if (!s) return;
  const old = s.slots[ui.slot];
  if (old && !old.raw && old.name === name) { return; }
  s.slots[ui.slot] = C.newItem(name);
  ui.search = '';
  save(); render();
}
function moveRule(id, dir) {
  const p = prof();
  const r = p.rules.find(x => x.id === id);
  const sib = p.rules.filter(x => x.handler === r.handler);
  const j = sib.indexOf(r) + dir;
  if (j < 0 || j >= sib.length) return;
  const a = p.rules.indexOf(r), b = p.rules.indexOf(sib[j]);
  p.rules[a] = sib[j]; p.rules[b] = r;
  save(); render();
}
function defaultAction(p) { return p.sets[0] ? { type: 'equipSet', setId: p.sets[0].id } : C.newAction('equipSet'); }

async function saveFile(filename, text, label, help) {
  if (downloads) {
    try { await downloads.save({ filename, data: text }); toast(label + ' saved as ' + filename); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  ui.dialog = { type: 'text', title: label, text, filename, help }; render();
}
function copyText(text) {
  const done = () => toast('Copied to the clipboard');
  const fallback = () => { const ta = $('#out-text') || $('.lua'); if (ta && ta.select) { ta.select(); } toast('Select the text and copy it with your keyboard'); };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}
function exportLua() {
  const p = prof();
  const errs = C.validate(p).filter(i => i.sev === 'error').length;
  const name = (p.job || p.name || 'profile').replace(/[^\w-]+/g, '_');
  saveFile(name + '.lua.txt', C.generateLua(p), 'Lua file', 'Saving as .lua is not possible from this page, so the file is saved as ' + name + '.lua.txt. Rename it to ' + name + '.lua before putting it in your LuAshitacast folder.');
  if (errs) toast('Exported, but ' + errs + ' problem' + (errs > 1 ? 's' : '') + ' should be fixed first. See Lua & Checks.');
}
function replaceProject(next, msg) {
  const before = JSON.stringify(project);
  project = next; ui.profileId = null; ui.setId = null; ui.tab = 'sets';
  save(); render();
  toast(msg, () => { project = C.normaliseProject(JSON.parse(before)); ui.profileId = null; ui.setId = null; save(); render(); });
}

function doImport() {
  const d = ui.dialog;
  if (!(d.text || '').trim()) { d.error = 'Paste your Lua or choose a file first.'; render(); return; }
  let job = d.job || '';
  const base = (d.fileName || '').replace(/\.lua(\.txt)?$/i, '');
  if (!job && C.JOB_ABBRS.indexOf(base.toUpperCase()) >= 0) job = base.toUpperCase();
  const name = (d.name || '').trim() || base || job || 'Imported';
  try {
    const p = C.importLua(d.text, { name, job, fileName: d.fileName });
    project.profiles.push(p);
    ui.profileId = p.id; ui.setId = null; ui.tab = 'lua'; ui.dialog = null;
    save(); render();
    toast('Imported ' + p.sets.length + ' sets and ' + p.rules.length + ' rules');
  } catch (e) {
    d.error = e.name === 'LuaSyntaxError' ? 'This does not look like valid Lua: ' + e.message + (e.line ? ' (line ' + e.line + ')' : '') + '. Fix it in a text editor and try again.' : 'Could not import this file: ' + e.message;
    render();
  }
}

function onClick(e) {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a, p = prof();
  switch (a) {
    case 'tab': ui.tab = el.dataset.tab; render(); break;
    case 'handler': ui.handler = el.dataset.id; render(); break;
    case 'pick-set': ui.setId = el.dataset.id; render(); break;
    case 'new-set': newSetAction(); break;
    case 'dup-set': { const s = curSet(); if (!s) break; const c = C.clone(s); c.id = C.uid('set'); c.name = uniqueName(s.name + '_Copy', p.sets.map(x => x.name)); p.sets.splice(p.sets.indexOf(s) + 1, 0, c); ui.setId = c.id; save(); render(); break; }
    case 'slot': ui.slot = el.dataset.slot; ui.search = ''; ui.focusSearch = true; render(); break;
    case 'pick-item': pickItem(el.dataset.name); break;
    case 'clear-slot': { const s = curSet(); if (s) { delete s.slots[ui.slot]; save(); render(); } break; }
    case 'del': {
      const [kind, id] = el.dataset.key.split(':');
      arm(el.dataset.key, () => {
        if (kind === 'set') { const i = p.sets.findIndex(s => s.id === id); p.sets.splice(i, 1); ui.setId = null; toast('Set deleted. Rules that used it now show a problem in Lua & Checks.'); }
        else if (kind === 'rule') p.rules = p.rules.filter(r => r.id !== id);
        else if (kind === 'var') p.variables = p.variables.filter(v => v.id !== id);
        else if (kind === 'cmd') p.commands = p.commands.filter(c => c.id !== id);
        else if (kind === 'prof') { project.profiles = project.profiles.filter(x => x.id !== id); ui.profileId = null; ui.setId = null; }
        save(); render();
      });
      break;
    }
    case 'rule-add': { const r = C.newRule(ui.handler); r.actions.push(defaultAction(p)); p.rules.push(r); ui.flash = r.id; save(); render(); break; }
    case 'raw-add': { p.rules.push(C.newRawRule(ui.handler, '-- your Lua here')); save(); render(); break; }
    case 'rule-up': moveRule(el.dataset.id, -1); break;
    case 'rule-down': moveRule(el.dataset.id, 1); break;
    case 'rule-dup': { const r = p.rules.find(x => x.id === el.dataset.id); const c = C.clone(r); c.id = C.uid('rule'); c.name = r.name ? r.name + ' copy' : ''; p.rules.splice(p.rules.indexOf(r) + 1, 0, c); ui.flash = c.id; save(); render(); break; }
    case 'cond-add': { const r = p.rules.find(x => x.id === el.dataset.rule); const g = nodeAt(r, el.dataset.path); const h = C.HANDLERS.find(x => x.id === r.handler); g.children.push(C.newCond(h.action ? 'action.name' : 'player.status')); save(); render(); break; }
    case 'grp-add': { const r = p.rules.find(x => x.id === el.dataset.rule); const g = nodeAt(r, el.dataset.path); const ng = C.emptyGroup('OR'); ng.children.push(C.newCond(C.HANDLERS.find(x => x.id === r.handler).action ? 'action.name' : 'player.status')); g.children.push(ng); save(); render(); break; }
    case 'grp-toggle': { const r = p.rules.find(x => x.id === el.dataset.rule); const g = nodeAt(r, el.dataset.path); g.op = g.op === 'OR' ? 'AND' : 'OR'; save(); render(); break; }
    case 'cond-del': case 'grp-del': { const r = p.rules.find(x => x.id === el.dataset.rule); const pp = parentAt(r, el.dataset.path); pp.parent.children.splice(pp.index, 1); save(); render(); break; }
    case 'act-add': { const r = p.rules.find(x => x.id === el.dataset.rule); r.actions.push(defaultAction(p)); save(); render(); break; }
    case 'act-del': { const r = p.rules.find(x => x.id === el.dataset.rule); r.actions.splice(Number(el.dataset.idx), 1); save(); render(); break; }
    case 'var-add': { p.variables.push({ id: C.uid('var'), name: uniqueName('Mode', p.variables.map(v => v.name)), options: ['Normal', 'Alt'], value: 'Normal' }); save(); render(); break; }
    case 'cmd-add': { p.commands.push({ id: C.uid('cmd'), name: '', kind: 'cycle', varId: p.variables[0] ? p.variables[0].id : '' }); save(); render(); break; }
    case 'new-profile': ui.dialog = { type: 'new-profile', job: 'WAR', name: 'WAR', tmpl: D.defaultTemplate('WAR') }; render(); break;
    case 'np-tmpl': ui.dialog.tmpl = el.dataset.id; syncDialogFields(); render(); break;
    case 'np-create': { const d = ui.dialog; const np = D.makeProfile(d.job, d.tmpl, (d.name || '').trim() || d.job || 'Profile'); project.profiles.push(np); ui.profileId = np.id; ui.setId = null; ui.tab = 'sets'; ui.dialog = null; save(); render(); break; }
    case 'open-import': ui.dialog = { type: 'import', text: '', name: '', job: '', fileName: '', error: '' }; render(); break;
    case 'pick-lua-file': pickFile('.lua,.txt,text/plain', txt => { ui.dialog.text = txt.text; ui.dialog.fileName = txt.name; render(); }); break;
    case 'do-import': syncDialogFields(); doImport(); break;
    case 'close-dialog': ui.dialog = null; render(); break;
    case 'copy-dialog': copyText(ui.dialog.text); break;
    case 'open-project': pickFile('.json,application/json', txt => {
      try { replaceProject(C.normaliseProject(JSON.parse(txt.text)), 'Opened ' + txt.name); }
      catch (err) { toast('Could not open this file: ' + err.message); }
    }); break;
    case 'save-project': project.savedAt = Date.now(); saveFile((project.name || 'gear-project').replace(/[^\w-]+/g, '_') + '.json', JSON.stringify(project, null, 2), 'Project file', 'Copy this text into a file ending in .json. You can open it again with Open project.'); break;
    case 'export-lua': exportLua(); break;
    case 'copy-lua': copyText(C.generateLua(p)); break;
    case 'dismiss-report': p.importReport = null; save(); render(); break;
    case 'goto-rule': { const r = p.rules.find(x => x.id === el.dataset.id); if (r) { ui.tab = 'rules'; ui.handler = r.handler; ui.flash = r.id; render(); } break; }
    case 'goto-issue': {
      const i = lastIssues[Number(el.dataset.n)]; if (!i) break;
      ui.tab = i.ref.tab;
      if (i.ref.handler) ui.handler = i.ref.handler;
      if (i.ref.ruleId) ui.flash = i.ref.ruleId;
      if (i.ref.setId) ui.setId = i.ref.setId;
      render(); break;
    }
    case 'toast-undo': { const f = ui.toast && ui.toast.undoFn; ui.toast = null; if (f) f(); renderToast(); break; }
  }
}
function syncDialogFields() {
  const d = ui.dialog; if (!d) return;
  document.querySelectorAll('[data-dlg]').forEach(el => { d[el.dataset.dlg] = el.value; });
}
function pickFile(accept, cb) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = accept; inp.className = 'hidden-input';
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => cb({ name: f.name, text: String(rd.result) });
    rd.onerror = () => toast('Could not read that file');
    rd.readAsText(f);
  });
  document.body.appendChild(inp); inp.click();
  setTimeout(() => inp.remove(), 60000);
}

function onChange(e) {
  const el = e.target;
  if (el.dataset.bind) {
    applyBind(el);
    if (el.dataset.render) { save(); render(); } else refreshDerived();
    return;
  }
  const c = el.dataset.c, p = prof();
  if (!c) { if (el.dataset.dlg && ui.dialog) ui.dialog[el.dataset.dlg] = el.value; return; }
  switch (c) {
    case 'profile': ui.profileId = el.value; ui.setId = null; render(); break;
    case 'np-job': { const d = ui.dialog; const old = d.job; d.job = el.value; if (!d.name || d.name === old) d.name = el.value || d.name; d.tmpl = D.defaultTemplate(el.value); render(); break; }
    case 'cond-kind': { const r = p.rules.find(x => x.id === el.dataset.rule); const pp = parentAt(r, el.dataset.path); pp.parent.children[pp.index] = C.newCond(el.value); save(); render(); break; }
    case 'act-type': { const r = p.rules.find(x => x.id === el.dataset.rule); const i = Number(el.dataset.idx); const na = C.newAction(el.value); if (na.type === 'equipSet' && p.sets[0]) na.setId = p.sets[0].id; r.actions[i] = na; save(); render(); break; }
    case 'cmd-kind': { const cm = p.commands.find(x => x.id === el.dataset.id); cm.kind = el.value; if ((cm.kind === 'cycle' || cm.kind === 'set') && !cm.varId && p.variables[0]) cm.varId = p.variables[0].id; if (cm.kind === 'lock' && !cm.setId && p.sets[0]) cm.setId = p.sets[0].id; save(); render(); break; }
  }
}
function onInput(e) {
  const el = e.target;
  if (el.tagName === 'SELECT' || el.type === 'checkbox') return;
  if (el.dataset.bind) { applyBind(el); refreshDerived(); return; }
  if (el.dataset.search) { ui.search = el.value; const r = $('#results'); if (r) r.innerHTML = resultsHtml(); return; }
  if (el.dataset.dlg && ui.dialog) ui.dialog[el.dataset.dlg] = el.value;
}
function onKey(e) {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) {
    const first = $('#results .result');
    if (first) { e.preventDefault(); first.click(); }
  }
  if (e.key === 'Escape' && ui.dialog) { ui.dialog = null; render(); }
}

/* ---------------- boot ---------------- */
function boot() {
  project = loadProject();
  ensureSelection();
  const root = $('#app');
  root.addEventListener('click', onClick);
  root.addEventListener('change', onChange);
  root.addEventListener('input', onInput);
  root.addEventListener('keydown', onKey);
  render();
  window.addEventListener('pagehide', flushSave);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });
  try {
    if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { downloads = d; }, () => {});
  } catch (e) { /* no capability */ }
  try { localStorage.setItem(KEY + ':probe', '1'); localStorage.removeItem(KEY + ':probe'); } catch (e) { storageOK = false; const s = $('#savestate'); if (s) s.textContent = saveText(); }
}
window.addEventListener('DOMContentLoaded', boot);
})();

</script>

</body></html>
