<style>
/* Layout: app bar on top, tab strip, then a three-column workspace (sets / paper doll / slot picker) that stacks on phones. */
:root {
  --bg: #0a0f1f; --bg-deep: #060a15;
  --panel: #121b37; --panel-2: #18234a; --win-top: #1f2d5c; --win-bot: #111936;
  --edge: #5568a8; --edge-soft: #2a3868; --edge-faint: #1e2a52;
  --fg: #e9edf9; --muted: #9aa8d0; --faint: #6c7aa6;
  --gold: #e3bd62; --gold-ink: #261b04; --gold-soft: rgba(227,189,98,.16);
  --ok: #72d6a0; --warn: #f0c05a; --bad: #f27c72; --info: #86b4ff;
  --font-display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --font-body: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0; color: var(--fg); font: 16px/1.4 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
  background: radial-gradient(1200px 500px at 50% -120px, #1a2650 0%, transparent 70%), var(--bg);
  min-height: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3, h4, p { margin: 0; }
.wrap { max-width: 1320px; margin: 0 auto; }

/* App bar */
.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 14px 0 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font: 600 19px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.brand small { display: block; font: 500 11px/1.2 var(--font-body); color: var(--muted); letter-spacing: .14em; text-transform: uppercase; margin-top: 4px; }
.bar-mid { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex: 1 1 260px; min-width: 0; }
.bar-end { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-left: auto; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 13px; border-radius: 4px; border: 1px solid var(--edge-soft); background: linear-gradient(180deg, var(--panel-2), var(--panel)); cursor: pointer; font-weight: 600; font-size: 15px; white-space: nowrap; }
.btn:hover { border-color: var(--edge); background: linear-gradient(180deg, #213068, var(--panel-2)); }
.btn.primary { background: linear-gradient(180deg, #f0cd77, var(--gold)); color: var(--gold-ink); border-color: #b9923a; }
.btn.primary:hover { background: linear-gradient(180deg, #f7d98e, #ecc66f); }
.btn.small { padding: 4px 9px; font-size: 14px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); border-color: var(--edge-soft); background: var(--panel); }
.btn.danger { color: var(--bad); }
.btn.armed { background: var(--bad); color: #2b0805; border-color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: default; }
.icon-btn { width: 30px; height: 30px; padding: 0; }

input[type=text], input[type=number], select, textarea {
  background: var(--bg-deep); border: 1px solid var(--edge-soft); border-radius: 4px; padding: 7px 9px; min-width: 0; width: 100%;
}
input:hover, select:hover, textarea:hover { border-color: var(--edge); }
select { appearance: auto; padding-right: 4px; }
textarea { resize: vertical; font-family: var(--font-mono); font-size: 13px; line-height: 1.45; }
label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); letter-spacing: .04em; }
.inline-input { width: auto; flex: 1 1 140px; }

.pill-select { display: flex; gap: 6px; align-items: center; min-width: 0; }
.pill-select select { width: auto; max-width: 220px; font-weight: 600; }
input[type=text].projname { width: 190px; max-width: 100%; background: transparent; border-color: transparent; font-weight: 600; }
input[type=text].projname:hover, input[type=text].projname:focus { background: var(--bg-deep); border-color: var(--edge-soft); }

/* Tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--edge-soft); overflow-x: auto; scrollbar-width: thin; margin-bottom: 18px; }
.tab { padding: 10px 18px; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); font: 600 14px var(--font-display); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.tab:hover { color: var(--fg); }
.tab[aria-selected=true] { color: var(--gold); border-bottom-color: var(--gold); }
.badge { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 10px; font: 700 12px/1.4 var(--font-body); text-align: center; background: var(--edge-faint); color: var(--muted); }
.badge.err { background: var(--bad); color: #2b0805; }
.badge.warn { background: var(--warn); color: #2b1d02; }

/* Windows (FFXI-style panels) */
.win { background: linear-gradient(180deg, var(--win-top), var(--win-bot)); border: 1px solid var(--edge); border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), 0 10px 30px rgba(0,0,0,.35); }
.win > header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--edge-soft); flex-wrap: wrap; }
.win h2, .win h3 { font: 600 14px var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.win .body { padding: 14px; }
.plain { background: var(--panel); border: 1px solid var(--edge-soft); border-radius: 6px; }

.workspace { display: grid; grid-template-columns: 230px minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
@media (max-width: 1080px) { .workspace { grid-template-columns: 200px minmax(0, 1fr); } .workspace > .inspector { grid-column: 1 / -1; } }
@media (max-width: 700px) { .workspace { grid-template-columns: minmax(0, 1fr); } }

/* Set list */
.setlist { display: grid; gap: 4px; padding: 8px; max-height: 520px; overflow: auto; }
.setrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; padding: 8px 10px; border: 1px solid transparent; border-radius: 4px; background: none; cursor: pointer; min-width: 0; }
.setrow:hover { background: rgba(255,255,255,.05); }
.setrow[aria-current=true] { background: var(--gold-soft); border-color: rgba(227,189,98,.5); }
.setrow b { font-weight: 600; overflow-wrap: anywhere; }
.setrow span { color: var(--muted); font-size: 13px; }
.setrow .cnt { grid-row: 1 / 3; grid-column: 2; align-self: center; font: 600 13px var(--font-mono); color: var(--faint); }
.setrow[aria-current=true] .cnt { color: var(--gold); }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; }

/* Paper doll */
.doll-wrap { position: relative; padding: 18px; }
.doll-title { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 14px; }
.doll-title input.name { font: 600 22px var(--font-display); letter-spacing: .04em; background: transparent; border-color: transparent; padding: 4px 8px; flex: 1 1 200px; width: auto; }
.doll-title input.name:hover, .doll-title input.name:focus { background: var(--bg-deep); border-color: var(--edge-soft); }
.doll { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; max-width: 640px; margin: 0 auto; }
.doll-crest { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: .09; }
.doll-crest svg { width: 70%; height: auto; }
.slot { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; text-align: left; min-height: 104px; padding: 8px 9px 9px; border-radius: 5px; cursor: pointer;
  border: 1px solid var(--edge-soft); background: linear-gradient(180deg, rgba(8,12,28,.9), rgba(14,20,44,.9)); box-shadow: inset 0 2px 8px rgba(0,0,0,.5); min-width: 0; }
.slot:hover { border-color: var(--edge); background: linear-gradient(180deg, rgba(12,18,40,.95), rgba(22,31,66,.95)); }
.slot[aria-pressed=true] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold), 0 0 18px rgba(227,189,98,.25); }
.slot[aria-pressed=true]::after { content: ''; position: absolute; left: -9px; top: 12px; border: 6px solid transparent; border-left-color: var(--gold); border-right: 0; }
.slot .sl { font: 600 11px var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); display: flex; justify-content: space-between; gap: 4px; }
.slot .gem { width: 8px; height: 8px; transform: rotate(45deg); background: var(--edge-faint); flex: none; margin-top: 2px; }
.slot.filled .gem { background: var(--gold); box-shadow: 0 0 6px rgba(227,189,98,.7); }
.slot .item { font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; font-size: 15px; }
.slot .empty { color: var(--faint); font-weight: 400; font-style: italic; font-size: 14px; }
.slot .meta { display: flex; gap: 4px; flex-wrap: wrap; font-size: 11px; }
.tag { padding: 0 5px; border-radius: 3px; background: var(--edge-faint); color: var(--info); font-weight: 600; letter-spacing: .03em; }
.tag.raw { color: var(--warn); }
@media (max-width: 520px) { .doll { gap: 6px; } .slot { min-height: 88px; padding: 6px; } .slot .item { font-size: 13px; } .doll-wrap { padding: 10px; } }

.used-in { margin-top: 16px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 14px; }
.chip { padding: 2px 9px; border-radius: 12px; border: 1px solid var(--edge-soft); background: var(--panel); font-size: 13px; cursor: pointer; color: var(--fg); }
.chip:hover { border-color: var(--gold); }
textarea.note { margin-top: 12px; min-height: 40px; font-family: var(--font-body); font-size: 14px; }

/* Inspector / picker */
.inspector .body { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.results { display: grid; max-height: 280px; overflow: auto; border: 1px solid var(--edge-soft); border-radius: 4px; background: var(--bg-deep); }
.result { text-align: left; background: none; border: 0; border-bottom: 1px solid var(--edge-faint); padding: 8px 10px; cursor: pointer; overflow-wrap: anywhere; }
.result:last-child { border-bottom: 0; }
.result:hover { background: var(--gold-soft); }
.result.custom { color: var(--gold); font-weight: 600; }
.result[aria-current=true] { background: var(--gold-soft); }
.hint { color: var(--muted); font-size: 14px; }
.hint.small { font-size: 13px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sample-note { font-size: 12px; color: var(--faint); }

/* Rules */
.handler-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.hpill { padding: 7px 14px; border-radius: 4px; border: 1px solid var(--edge-soft); background: var(--panel); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; font-weight: 600; }
.hpill:hover { border-color: var(--edge); }
.hpill[aria-selected=true] { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
.handler-info { margin-bottom: 14px; padding: 10px 14px; border-left: 3px solid var(--info); background: rgba(134,180,255,.07); border-radius: 0 4px 4px 0; }
.handler-info code { font-family: var(--font-mono); font-size: 13px; color: var(--info); }
.rules { display: grid; gap: 14px; max-width: 980px; }
.rule { overflow: hidden; }
.rule.off { opacity: .55; }
.rule.flash { animation: flash 1.2s ease-out 1; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--gold); } to { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .rule.flash { animation: none; outline: 2px solid var(--gold); } }
.rule-head { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--edge-soft); flex-wrap: wrap; }
.rule-head .num { font: 700 12px var(--font-mono); color: var(--faint); width: 22px; text-align: center; }
.rule-head input.rname { flex: 1 1 200px; width: auto; background: transparent; border-color: transparent; font-weight: 600; }
.rule-head input.rname:hover, .rule-head input.rname:focus { background: var(--bg-deep); border-color: var(--edge-soft); }
.toggle { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-size: 14px; color: var(--muted); }
.toggle input { width: 16px; height: 16px; accent-color: var(--gold); }
.rule-body { display: grid; gap: 14px; padding: 12px 14px 14px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 860px) { .rule-body { grid-template-columns: minmax(0, 1fr); } }
.col-title { font: 700 12px var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
.english { grid-column: 1 / -1; padding: 9px 12px; border-radius: 4px; background: rgba(0,0,0,.25); color: #cfd8f5; border-left: 3px solid var(--gold); }
.english b { color: var(--fg); }
.group { border-left: 2px solid var(--edge); padding-left: 10px; display: grid; gap: 8px; }
.group .group { margin-top: 2px; border-left-style: dashed; }
.group-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.logic { font-weight: 700; font-size: 12px; letter-spacing: .08em; padding: 3px 9px; border-radius: 3px; border: 1px solid var(--edge); background: var(--panel); cursor: pointer; }
.logic.or { color: var(--warn); border-color: rgba(240,192,90,.6); }
.logic.and { color: var(--info); }
.crow { display: grid; grid-template-columns: minmax(120px, 1.1fr) minmax(90px, .9fr) minmax(90px, 1fr) auto; gap: 6px; align-items: center; }
.crow.two { grid-template-columns: minmax(120px, 1.1fr) minmax(0, 1.9fr) auto; }
.crow.rawc { grid-template-columns: minmax(120px, 1fr) minmax(0, 2fr) auto; }
@media (max-width: 560px) { .crow, .crow.two, .crow.rawc { grid-template-columns: 1fr 1fr; } .crow > :last-child { justify-self: end; } }
.arow { display: grid; grid-template-columns: minmax(130px, 1fr) minmax(0, 1.6fr) auto; gap: 6px; align-items: start; }
.arow .stack { display: grid; gap: 6px; }
@media (max-width: 560px) { .arow { grid-template-columns: 1fr auto; } .arow .stack { grid-column: 1 / -1; grid-row: 2; } }
.actions-list { display: grid; gap: 8px; }
.pair { display: flex; gap: 6px; flex-wrap: wrap; }
.pair > * { flex: 1 1 100px; min-width: 0; }
.raw-flag { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--warn); }
.add-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.empty-state { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--edge-soft); border-radius: 6px; max-width: 980px; }

/* Profile tab */
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; max-width: 1100px; }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.stack-16 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
code { overflow-wrap: anywhere; font-family: var(--font-mono); font-size: .88em; }
.form { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.row-item { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--edge-faint); border-radius: 4px; background: rgba(0,0,0,.18); }
details.adv { border: 1px solid var(--edge-soft); border-radius: 6px; background: var(--panel); }
details.adv > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; color: var(--muted); }
details.adv[open] > summary { border-bottom: 1px solid var(--edge-soft); color: var(--fg); }
details.adv .inner { padding: 12px 14px; display: grid; gap: 12px; }

/* Lua + checks */
.lua-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 960px) { .lua-grid { grid-template-columns: minmax(0, 1fr); } .lua-grid .checks { order: -1; } }
pre.lua { margin: 0; padding: 14px; overflow: auto; max-height: 72vh; background: var(--bg-deep); font: 13px/1.55 var(--font-mono); tab-size: 4; border-radius: 0 0 6px 6px; color: #d5dcf2; }
.lc { color: #6f7fa8; font-style: italic; } .ls { color: #9fdc9a; } .ln { color: #f2a86c; } .lk { color: #c9a0ff; } .ll { color: #f2a86c; } .la { color: #7fc4ff; } .lf { color: #e8d48a; }
.issue { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; padding: 10px 12px; border-bottom: 1px solid var(--edge-faint); }
.issue:last-child { border-bottom: 0; }
.issue .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
.issue.error .dot { background: var(--bad); } .issue.warn .dot { background: var(--warn); } .issue.info .dot { background: var(--info); }
.issue b { font-weight: 600; }
.issue p { color: var(--muted); font-size: 14px; grid-column: 2; }
.issue .go { grid-column: 2; justify-self: start; }
.allgood { padding: 18px; color: var(--ok); font-weight: 600; }
.note-line { padding: 8px 12px; border-bottom: 1px solid var(--edge-faint); font-size: 14px; }
.note-line:last-child { border-bottom: 0; }
.note-line .ln { color: var(--faint); font: 12px var(--font-mono); margin-right: 8px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 10px 14px; border-bottom: 1px solid var(--edge-soft); font-size: 14px; color: var(--muted); }
.stats b { color: var(--fg); font-family: var(--font-mono); }

/* Dialog + toast */
.scrim { position: fixed; inset: 0; background: rgba(3,6,14,.72); display: grid; place-items: center; padding: 16px; z-index: 50; }
.dialog { width: min(640px, 100%); max-height: 92vh; overflow: auto; }
.dialog .body { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.dialog footer { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--edge-soft); flex-wrap: wrap; }
.tmpl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 480px) { .tmpl-grid { grid-template-columns: 1fr; } }
.tmpl { text-align: left; padding: 10px 12px; border: 1px solid var(--edge-soft); background: var(--panel); border-radius: 4px; cursor: pointer; display: grid; gap: 2px; }
.tmpl:hover { border-color: var(--edge); }
.tmpl[aria-pressed=true] { border-color: var(--gold); background: var(--gold-soft); }
.tmpl small { color: var(--muted); font-size: 13px; }
.err-text { color: var(--bad); font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: #0d1530; border: 1px solid var(--gold); color: var(--fg); padding: 10px 16px; border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,.5); display: flex; gap: 12px; align-items: center; max-width: calc(100vw - 32px); }
.hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

</style>

'use strict';

/* ------------------------------------------------------------------ */
/* Reference data (from the LuAshitacast docs)                         */

const SLOTS = ['Main','Sub','Range','Ammo','Head','Neck','Ear1','Ear2','Body','Hands','Ring1','Ring2','Back','Waist','Legs','Feet'];

const HANDLERS = [
  { id:'HandleDefault',     label:'Default',     action:false, spell:false, blurb:'Runs continuously while you are not performing an action. This is where idle, resting and engaged gear belong.' },
  { id:'HandlePrecast',     label:'Precast',     action:true,  spell:true,  blurb:'Runs when you start a spell, before the spell packet is sent. Use it for fast cast and quick magic gear.' },
  { id:'HandleMidcast',     label:'Midcast',     action:true,  spell:true,  blurb:'Runs after the spell packet is sent. Use it for gear that changes spell potency, accuracy or recast.' },
  { id:'HandleAbility',     label:'Ability',     action:true,  spell:false, blurb:'Runs when you use a job ability.' },
  { id:'HandleWeaponskill', label:'Weaponskill', action:true,  spell:false, blurb:'Runs when you use a weaponskill.' },

const EQ_OPS  = [['==','is'],['~=','is not']];

/* Condition kinds. `src` is the gData table the value comes from. */
const CONDS = {

  'player.level':  { group:'You', label:'Your main job level',  noun:'your main job level',src:'player',      field:'MainJobLevel',  type:'num',  ops:NUM_OPS, def:75 },
  'env.day':       { group:'World', label:'Day element',        noun:'the day element',    src:'environment', field:'DayElement',    type:'enum', options:ELEMENTS, ops:EQ_OPS, def:'Fire' },

  'env.time':      { group:'World', label:'Vana\'diel time (hour)', noun:'the Vana\'diel hour', src:'environment', field:'Time',     type:'num',  ops:NUM_OPS, def:18 },

  'action.name':   { group:'Action', label:'Action name',       noun:'the action',         src:'action',      field:'Name',          type:'name', ops:[['==','is'],['~=','is not'],['contains','contains'],['oneof','is one of']], def:'', needsAction:true },
  'action.skill':  { group:'Action', label:'Spell skill',       noun:'the spell skill',    src:'action',      field:'Skill',         type:'enum', options:SPELL_SKILLS, ops:EQ_OPS, def:'Healing Magic', needsAction:true, spellOnly:true },
  'action.element':{ group:'Action', label:'Spell element',     noun:'the spell element',  src:'action',      field:'Element',       type:'enum', options:ELEMENTS.concat(['Non-Elemental']), ops:EQ_OPS, def:'Fire', needsAction:true, spellOnly:true },
  'action.type':   { group:'Action', label:'Spell type',        noun:'the spell type',     src:'action',      field:'Type',          type:'enum', options:SPELL_TYPES, ops:EQ_OPS, def:'White Magic', needsAction:true, spellOnly:true },
  'action.mp':     { group:'Action', label:'Spell MP cost',     noun:'the spell MP cost',  src:'action',      field:'MpCost',        type:'num',  ops:NUM_OPS, def:100, needsAction:true, spellOnly:true },
  'buff':          { group:'Other', label:'Status effect',      type:'buff', ops:[['active','is active on you'],['inactive','is not active on you']], def:'' },

const FIELD_KIND = {};
Object.keys(CONDS).forEach(k => { const s = CONDS[k]; if (s.src && s.field) FIELD_KIND[s.src + '.' + s.field] = k; });

const ACTION_TYPES = [
  ['equipSet','Equip a gear set'],
  ['equipSetVar','Equip a set picked by a variable'],
  ['equipItem','Equip a single item'],
  ['message','Show a chat message'],
  ['setVar','Change a variable'],
  ['rawLua','Custom Lua'],
];

/* ------------------------------------------------------------------ */
/* Small helpers                                                       */
/* ------------------------------------------------------------------ */
const LUA_KEYWORDS = new Set('and break do else elseif end false for function goto if in local nil not or repeat return then true until while'.split(' '));
let uidN = 0;
function uid(p) { return (p || 'id') + '_' + Math.random().toString(36).slice(2, 7) + (uidN++).toString(36); }
function isIdent(s) { return /^[A-Za-z_][A-Za-z0-9_]*$/.test(s) && !LUA_KEYWORDS.has(s); }
function luaStr(s) {
  s = String(s == null ? '' : s);
  const esc = (t, q) => t.replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/\r/g, '\\r').split(q).join('\\' + q);
  if (s.indexOf("'") >= 0 && s.indexOf('"') < 0) return '"' + esc(s, '"') + '"';
  return "'" + esc(s, "'") + "'";
}
function luaNum(n) { n = Number(n); return isFinite(n) ? String(n) : '0'; }
function setPath(name) {
  return 'sets' + String(name).split('.').filter(Boolean).map(s => isIdent(s) ? '.' + s : '[' + luaStr(s) + ']').join('');
}
function dedent(text) {
  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  while (lines.length && !lines[0].trim()) lines.shift();
  while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
  let min = Infinity;
  lines.forEach(l => { if (l.trim()) min = Math.min(min, l.match(/^[ \t]*/)[0].length); });
  if (!isFinite(min)) min = 0;
  return lines.map(l => l.slice(min).replace(/\s+$/, '')).join('\n');
}
function indentText(text, pad) { return text.split('\n').map(l => l ? pad + l : l).join('\n'); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function emptyGroup(op) { return { op: op || 'AND', children: [] }; }
function isGroup(n) { return n && Array.isArray(n.children); }

/* ------------------------------------------------------------------ */
/* Model factories                                                     */
/* ------------------------------------------------------------------ */
function newSet(name) { return { id: uid('set'), name: name || 'NewSet', note: '', slots: {}, extras: [] }; }
function newItem(name) { return { name: name || '', augPath: '', augments: [], extras: [], raw: null }; }
function newCond(kind) {
  const spec = CONDS[kind] || CONDS['player.status'];
  const c = { kind: kind, op: spec.ops && spec.ops[0] ? spec.ops[0][0] : '', value: spec.def == null ? '' : spec.def };
  if (spec.type === 'num') c.op = '>';
  if (kind === 'raw') c.expr = '';
  if (kind === 'var') c.varId = '';
  return c;
}
function newRule(handler) {
  return { id: uid('rule'), kind: 'rule', handler: handler, name: '', enabled: true, exclusive: false, when: emptyGroup('AND'), actions: [] };
}
function newRawRule(handler, code) {
  return { id: uid('rule'), kind: 'raw', handler: handler, name: '', enabled: true, exclusive: false, code: code || '' };
}
function newAction(type) {
  switch (type) {
    case 'equipSet': return { type, setId: '' };
    case 'equipSetVar': return { type, prefix: '', varId: '' };
    case 'equipItem': return { type, slot: 'Main', item: '' };
    case 'message': return { type, text: '' };
    case 'setVar': return { type, varId: '', value: '' };
    default: return { type: 'rawLua', code: '' };
  }
}
function newProfile(name, job) {
  return {
    id: uid('prof'), name: name || job || 'Profile', job: job || '',
    settings: { allowAddSet: true, addSetBackup: true },
    sets: [], variables: [], rules: [], commands: [],
    names: { player: 'player', action: 'action', environment: 'environment' },
    raw: { custom: '', OnLoad: '', OnUnload: '', HandleCommand: '' },
    importReport: null,
  };
}
function findSet(profile, idOrName) {
  if (!idOrName) return null;
  let s = profile.sets.find(x => x.id === idOrName);
  if (s) return s;
  const low = String(idOrName).toLowerCase();
  return profile.sets.find(x => x.name.toLowerCase() === low) || null;
}
function findVar(profile, id) { return profile.variables.find(v => v.id === id) || null; }

/* ------------------------------------------------------------------ */
/* Lua generation                                                      */
/* ------------------------------------------------------------------ */
function keyText(k) { return isIdent(k) ? k : '[' + luaStr(k) + ']'; }

function itemExpr(it) {
  if (!it) return null;
  if (it.raw) return it.raw;
  const name = (it.name || '').trim();
  if (!name) return null;
  const aug = (it.augments || []).map(a => String(a).trim()).filter(Boolean);
  const extras = it.extras || [];
  if (!it.augPath && !aug.length && !extras.length) return luaStr(name);
  const parts = ['Name = ' + luaStr(name)];
  if (it.augPath) parts.push('AugPath = ' + luaStr(it.augPath));
  if (aug.length === 1) parts.push('Augment = ' + luaStr(aug[0]));
  else if (aug.length > 1) parts.push('Augment = { ' + aug.map(luaStr).join(', ') + ' }');
  extras.forEach(e => parts.push(e.k + ' = ' + e.raw));
  return '{ ' + parts.join(', ') + ' }';
}

function emitSetBody(set, pad, kids) {
  const lines = [];
  if (set && set.note) set.note.split('\n').forEach(n => lines.push(pad + '-- ' + n));
  if (set) {
    SLOTS.forEach(slot => {
      const e = itemExpr(set.slots[slot]);
      if (e) lines.push(pad + slot + ' = ' + e + ',');
    });
    (set.extras || []).forEach(x => lines.push(pad + (x.k ? x.k + ' = ' : '') + x.raw + ','));
  }
  if (kids) lines.push.apply(lines, kids);
  return lines;
}

function emitSetTree(profile) {
  const rootNode = { kids: new Map(), set: null };
  profile.sets.forEach(s => {
    const segs = String(s.name).split('.').filter(Boolean);
    if (!segs.length) return;
    let n = rootNode;
    segs.forEach(seg => { if (!n.kids.has(seg)) n.kids.set(seg, { kids: new Map(), set: null }); n = n.kids.get(seg); });
    n.set = s;
  });
  function emit(node, depth) {
    const pad = '    '.repeat(depth + 1);
    const out = [];
    node.kids.forEach((child, key) => {
      const kidLines = child.kids.size ? emit(child, depth + 1) : null;
      const body = emitSetBody(child.set, '    '.repeat(depth + 2), kidLines);
      if (!body.length) out.push(pad + keyText(key) + ' = {},');
      else { out.push(pad + keyText(key) + ' = {'); out.push.apply(out, body); out.push(pad + '},'); }
    });
    return out;
  }
  return emit(rootNode, 0);
}

function condExpr(c, profile, names) {
  const spec = CONDS[c.kind];
  if (!spec) return 'false';
  const nm = (src) => (names && names[src]) || src;
  switch (spec.type) {
    case 'enum': case 'text':
      return nm(spec.src) + '.' + spec.field + ' ' + (c.op === '~=' ? '~=' : '==') + ' ' + luaStr(c.value);
    case 'num':
      return nm(spec.src) + '.' + spec.field + ' ' + (['<','<=','>','>=','==','~='].indexOf(c.op) >= 0 ? c.op : '>') + ' ' + luaNum(c.value);
    case 'bool':
      return (c.op === 'false' ? 'not ' : '') + nm(spec.src) + '.' + spec.field;
    case 'name': {
      const ref = nm('action') + '.Name';
      if (c.op === 'contains') return 'string.find(' + ref + ', ' + luaStr(c.value) + ', 1, true) ~= nil';
      if (c.op === 'oneof') {
        const names2 = String(c.value || '').split(',').map(x => x.trim()).filter(Boolean);
        if (!names2.length) return 'false';
        const parts = names2.map(x => ref + ' == ' + luaStr(x));
        return parts.length === 1 ? parts[0] : '(' + parts.join(' or ') + ')';
      }
      return ref + ' ' + (c.op === '~=' ? '~=' : '==') + ' ' + luaStr(c.value);
    }
    case 'buff':
      return 'gData.GetBuffCount(' + luaStr(c.value) + ') ' + (c.op === 'inactive' ? '== 0' : '> 0');
    case 'pet':
      return 'gData.GetPet() ' + (c.op === 'none' ? '==' : '~=') + ' nil';
    case 'var': {
      const v = findVar(profile, c.varId);
      if (!v || !isIdent(v.name)) return 'false';
      return v.name + ' ' + (c.op === '~=' ? '~=' : '==') + ' ' + luaStr(c.value);
    }
    case 'raw':
      return '(' + ((c.expr || '').trim() || 'true') + ')';
  }
  return 'false';
}

function groupExpr(g, profile, names, top) {
  const parts = (g.children || []).map(ch => isGroup(ch) ? groupExpr(ch, profile, names, false) : condExpr(ch, profile, names)).filter(Boolean);
  if (!parts.length) return null;
  if (parts.length === 1) return parts[0];
  const joined = parts.join(g.op === 'OR' ? ' or ' : ' and ');
  return top ? joined : '(' + joined + ')';
}

function actionLines(a, profile) {
  switch (a.type) {
    case 'equipSet': {
      const s = findSet(profile, a.setId) || (a.setName ? { name: a.setName } : null);
      return s ? ['gFunc.EquipSet(' + setPath(s.name) + ');'] : ['-- (gear set not found, nothing equipped)'];
    }
    case 'equipSetVar': {
      const v = findVar(profile, a.varId);
      if (!v || !isIdent(v.name)) return ['-- (variable not found, nothing equipped)'];
      return ['gFunc.EquipSet(' + (a.prefix ? luaStr(a.prefix) + ' .. ' : '') + v.name + ');'];
    }
    case 'equipItem':
      return (a.item || '').trim() ? ['gFunc.Equip(' + luaStr(a.slot) + ', ' + luaStr(a.item) + ');'] : ['-- (no item chosen)'];
    case 'message':
      return ['gFunc.Message(' + luaStr(a.text) + ');'];
    case 'setVar': {
      const v = findVar(profile, a.varId);
      return v && isIdent(v.name) ? [v.name + ' = ' + luaStr(a.value) + ';'] : ['-- (variable not found)'];
    }
    case 'rawLua':
      return (a.code || '').trim() ? dedent(a.code).split('\n') : [];
  }
  return [];
}

function ruleComment(r) {
  const t = (r.name || '').replace(/\s+/g, ' ').trim();
  return t ? '-- ' + t : null;
}

function genHandlerBody(profile, hname) {
  const names = profile.names;
  const rules = profile.rules.filter(r => r.handler === hname);
  const L = [];
  let chain = false;
  rules.forEach(r => {
    if (!r.enabled) { L.push('-- Disabled in Gear Studio: ' + (r.name || (r.kind === 'raw' ? 'custom Lua block' : 'unnamed rule')).replace(/\s+/g, ' ')); return; }
    if (r.kind === 'raw') {
      if (chain) { L.push('end'); chain = false; }
      L.push.apply(L, dedent(r.code || '').split('\n').filter((l, i, arr) => !(arr.length === 1 && !l)));
      return;
    }
    const expr = groupExpr(r.when, profile, names, true);
    const body = [].concat.apply([], r.actions.map(a => actionLines(a, profile))).map(l => '    ' + l);
    const cm = ruleComment(r);
    if (r.exclusive && chain) {
      if (cm) L.push('    ' + cm);
      if (expr) { L.push('elseif (' + expr + ') then'); L.push.apply(L, body); }
      else { L.push('else'); L.push.apply(L, body); L.push('end'); chain = false; }
      return;
    }
    if (chain) { L.push('end'); chain = false; }
    if (cm) L.push(cm);
    if (expr) { L.push('if (' + expr + ') then'); L.push.apply(L, body); chain = true; }
    else L.push.apply(L, body.map(l => l.slice(4)));
  });
  if (chain) L.push('end');
  return L;
}

function withLocals(profile, lines) {
  const text = lines.join('\n');
  const decl = { player: 'gData.GetPlayer()', action: 'gData.GetAction()', environment: 'gData.GetEnvironment()' };
  const out = [];
  Object.keys(decl).forEach(k => {
    const alias = profile.names[k] || k;
    if (new RegExp('(^|[^\\w.])' + alias.replace(/[^\w]/g, '') + '\\b').test(text)) out.push('local ' + alias + ' = ' + decl[k] + ';');
  });
  return out.length ? out.concat(lines.length ? [''] : [], lines) : lines;
}

function generateLua(profile) {
  const L = [];
  const w = s => L.push(s);
  const job = profile.job || profile.name;
  w('-- Generated by Ashita Gear Studio. Profile: ' + profile.name);
  w('-- Save as ' + (job || 'Job') + '.lua in ashita/config/addons/luashitacast/<CharName>_<CharId>/');
  w('');
  w('local profile = {};');
  w('');
  w('local sets = {');
  emitSetTree(profile).forEach(w);
  w('};');
  w('profile.Sets = sets;');
  if (!/profile\s*\.\s*Packer/.test(profile.raw.custom || '')) w('profile.Packer = {};');
  w('');

  const vars = profile.variables.filter(v => isIdent(v.name));
  const needCycle = profile.commands.some(c => c.kind === 'cycle');
  if (vars.length) {
    w('-- Variables (change them in game with /lac fwd <command>)');
    vars.forEach(v => {
      w('local ' + v.name + ' = ' + luaStr(v.value || (v.options[0] || '')) + ';');
      if (profile.commands.some(c => c.kind === 'cycle' && c.varId === v.id))
        w('local ' + v.name + 'Options = { ' + v.options.map(luaStr).join(', ') + ' };');
    });
    w('');
  }
  if (needCycle) {
    w('local function CycleValue(list, current)');
    w('    for i, value in ipairs(list) do');
    w('        if (value == current) then');
    w('            return list[(i % #list) + 1];');
    w('        end');
    w('    end');
    w('    return list[1];');
    w('end');
    w('');
  }
  if ((profile.raw.custom || '').trim()) {
    w('-- Custom Lua kept from the imported profile');
    w(dedent(profile.raw.custom));
    w('');
  }

  // OnLoad / OnUnload
  const onLoad = ['gSettings.AllowAddSet = ' + (profile.settings.allowAddSet ? 'true' : 'false') + ';'];
  if (profile.settings.addSetBackup === false) onLoad.push('gSettings.AddSetBackup = false;');
  if ((profile.raw.OnLoad || '').trim()) onLoad.push.apply(onLoad, dedent(profile.raw.OnLoad).split('\n'));
  w('profile.OnLoad = function()');
  onLoad.forEach(l => w(l ? '    ' + l : l));
  w('end');
  w('');
  w('profile.OnUnload = function()');
  if ((profile.raw.OnUnload || '').trim()) dedent(profile.raw.OnUnload).split('\n').forEach(l => w(l ? '    ' + l : l));
  w('end');
  w('');

  // HandleCommand
  const cmdLines = [];
  if ((profile.raw.HandleCommand || '').trim()) cmdLines.push.apply(cmdLines, dedent(profile.raw.HandleCommand).split('\n'));
  const cmds = profile.commands.filter(c => (c.name || '').trim());
  if (cmds.length) {
    cmdLines.push('if (#args > 0) then');
    cmdLines.push('    local cmd = string.lower(args[1]);');
    cmds.forEach((c, i) => {
      cmdLines.push('    ' + (i === 0 ? 'if' : 'elseif') + ' (cmd == ' + luaStr(c.name.trim().toLowerCase()) + ') then');
      const v = findVar(profile, c.varId);
      const body = [];
      if (c.kind === 'cycle' && v && isIdent(v.name)) {
        body.push(v.name + ' = CycleValue(' + v.name + 'Options, ' + v.name + ');');
        body.push("gFunc.Message('" + v.name + ": ' .. " + v.name + ');');
      } else if (c.kind === 'set' && v && isIdent(v.name)) {
        body.push(v.name + ' = ' + luaStr(c.value) + ';');
        body.push("gFunc.Message('" + v.name + ": ' .. " + v.name + ');');
      } else if (c.kind === 'lock') {
        const s = findSet(profile, c.setId);
        body.push(s ? 'gFunc.LockSet(' + setPath(s.name) + ', ' + luaNum(c.seconds || 30) + ');' : '-- (gear set not found)');
      } else if (c.kind === 'raw') {
        body.push.apply(body, (c.code || '').trim() ? dedent(c.code).split('\n') : ['-- (empty)']);
      } else body.push('-- (command is not fully set up)');
      body.forEach(l => cmdLines.push('        ' + l));
    });
    cmdLines.push('    end');
    cmdLines.push('end');
  }
  w('profile.HandleCommand = function(args)');
  cmdLines.forEach(l => w(l ? '    ' + l : l));
  w('end');
  w('');

  GEN_ORDER.forEach(h => {
    const body = withLocals(profile, genHandlerBody(profile, h));
    w('profile.' + h + ' = function()');
    body.forEach(l => w(l ? '    ' + l : l));
    w('end');
    w('');
  });
  w('return profile;');
  return L.join('\n') + '\n';
}

/* ------------------------------------------------------------------ */
/* Plain-English descriptions                                          */
/* ------------------------------------------------------------------ */
function opWord(spec, op) {
  const f = (spec.ops || []).find(o => o[0] === op);
  return f ? f[1] : op;
}
function describeCond(c, profile) {
  const spec = CONDS[c.kind];
  if (!spec) return 'an unknown check';
  switch (spec.type) {
    case 'enum': case 'text': return spec.noun + ' ' + opWord(spec, c.op) + ' ' + (c.value === '' ? '(blank)' : c.value);
    case 'num': return spec.noun + ' ' + opWord(spec, c.op) + ' ' + c.value + (spec.unit || '');
    case 'bool': return opWord(spec, c.op);
    case 'name': return c.op === 'contains' ? 'the action name contains "' + (c.value || '(blank)') + '"' :
                        c.op === 'oneof' ? 'the action is one of ' + (c.value || '(none)') :
                        'the action ' + opWord(spec, c.op) + ' "' + (c.value || '(blank)') + '"';
    case 'buff': return (c.value || '(no effect chosen)') + ' ' + opWord(spec, c.op);
    case 'pet': return opWord(spec, c.op);
    case 'var': { const v = findVar(profile, c.varId); return (v ? v.name : '(missing variable)') + ' ' + (c.op === '~=' ? 'is not' : 'is') + ' ' + c.value; }
    case 'raw': { const t = (c.expr || '').replace(/\s+/g, ' ').trim(); return 'custom check <' + (t.length > 48 ? t.slice(0, 45) + '...' : t) + '>'; }
  }
  return '';
}
function describeGroup(g, profile, top) {
  const parts = (g.children || []).map(ch => isGroup(ch) ? describeGroup(ch, profile, false) : describeCond(ch, profile)).filter(Boolean);
  if (!parts.length) return '';
  if (parts.length === 1) return parts[0];
  const j = parts.join(g.op === 'OR' ? ' or ' : ' and ');
  return top ? j : '(' + j + ')';
}

    while (y - x >= 2 && T[x].t === 'op' && T[x].v === '(' && closeIdx(T, x) === y - 1) { x++; y--; }
    return [x, y];
  }
  function parse(x, y) {
    [x, y] = strip(x, y);
    let parts = splitTopLevel(T, x, y, t => t.t === 'kw' && t.v === 'or');
    if (parts.length > 1) return { op: 'OR', children: parts.map(p => parse(p[0], p[1])) };
    parts = splitTopLevel(T, x, y, t => t.t === 'kw' && t.v === 'and');
    if (parts.length > 1) return { op: 'AND', children: parts.map(p => parse(p[0], p[1])) };
    const leaf = matchLeaf(ctx, x, y);
    if (leaf) return leaf;
    const expr = ctx.src.slice(T[x].s, T[y - 1].e);
    ctx.notes.push({ line: T[x].line, kind: 'cond', text: 'The check "' + shorten(expr) + '" cannot be built from the visual options, so it is kept as a custom Lua check.' });
    return { kind: 'raw', op: '', value: '', expr };
  }
  const node = parse(a, b);
  return isGroup(node) ? node : { op: 'AND', children: [node] };
}

function importLua(src, opts) {
  opts = opts || {};
  src = String(src).replace(/^﻿/, '');
  const toks = lex(src);
  const ctx = { src, toks, sets: [], custom: [], notes: [], setsVar: 'sets', names: { player: 'player', action: 'action', environment: 'environment' }, handlers: {}, settings: { allowAddSet: true, addSetBackup: true } };

  const m = /profile\s*\.\s*Sets\s*=\s*([A-Za-z_]\w*)/.exec(src);
  if (m) ctx.setsVar = m[1];
  for (let i = 0; i + 8 < toks.length; i++) {
    if (toks[i].v === 'local' && toks[i + 1].t === 'name' && toks[i + 2].v === '=' && toks[i + 3].v === 'gData' && toks[i + 4].v === '.' && toks[i + 6].v === '(' && toks[i + 7].v === ')') {
      const f = toks[i + 5].v, nm = toks[i + 1].v;
      if (f === 'GetPlayer' && ctx.names.player === 'player') ctx.names.player = nm;
      if (f === 'GetAction' && ctx.names.action === 'action') ctx.names.action = nm;
      if (f === 'GetEnvironment' && ctx.names.environment === 'environment') ctx.names.environment = nm;
    }
  }

  const T = toks;
  let prevEnd = 0;
  splitStatements(T, 0, T.length).forEach(st => {
    const a = st.a;
    let e = st.b; if (T[e - 1].v === ';') e--;
    const v = i => T[i] && T[i].v;
    const gap = tidyGap(src.slice(prevEnd, T[a].s));
    prevEnd = T[st.b - 1].e;
    let used = false;
    if (v(a) === 'local' && v(a + 1) === 'profile' && v(a + 2) === '=' && v(a + 3) === '{' && closeIdx(T, a + 3) === e - 1) used = true;
    else if (v(a) === 'return' && v(a + 1) === 'profile' && e === a + 2) used = true;
    else if (v(a) === 'profile' && v(a + 1) === '.' && v(a + 2) === 'Packer' && v(a + 3) === '=' && v(a + 4) === '{' && v(a + 5) === '}' && e === a + 6) used = true;
    else if (v(a) === 'profile' && v(a + 1) === '.' && v(a + 2) === 'Sets' && v(a + 3) === '=') {
      if (e === a + 5 && T[a + 4].t === 'name') used = true;
      else if (v(a + 4) === '{' && closeIdx(T, a + 4) === e - 1) { buildSets(ctx, a + 4, ''); used = true; }
    } else if ((v(a) === 'local' && v(a + 1) === ctx.setsVar && v(a + 2) === '=' && v(a + 3) === '{' && closeIdx(T, a + 3) === e - 1)) { buildSets(ctx, a + 3, ''); used = true; }
    else if (v(a) === ctx.setsVar && v(a + 1) === '=' && v(a + 2) === '{' && closeIdx(T, a + 2) === e - 1) { buildSets(ctx, a + 2, ''); used = true; }
    else if (v(a) === ctx.setsVar && (v(a + 1) === '.' || v(a + 1) === '[')) {
      const segs = []; let i = a + 1;
      for (;;) {
        if (v(i) === '.' && T[i + 1] && T[i + 1].t === 'name') { segs.push(T[i + 1].v); i += 2; }
        else if (v(i) === '[' && T[i + 1] && T[i + 1].t === 'str' && v(i + 2) === ']') { segs.push(T[i + 1].v); i += 3; }
        else break;
      }
      if (segs.length && v(i) === '=' && v(i + 1) === '{' && closeIdx(T, i + 1) === e - 1) { buildSets(ctx, i + 1, segs.join('.')); used = true; }
    }
    if (!used) {
      let fnIdx = -1;
      if (v(a) === 'profile' && v(a + 1) === '.' && ALL_HANDLER_NAMES.has(v(a + 2)) && v(a + 3) === '=' && v(a + 4) === 'function') fnIdx = a + 4;
      let name = fnIdx >= 0 ? v(a + 2) : null, paren = fnIdx + 1;
      if (v(a) === 'function' && v(a + 1) === 'profile' && v(a + 2) === '.' && ALL_HANDLER_NAMES.has(v(a + 3))) { fnIdx = a; name = v(a + 3); paren = a + 4; }
      if (fnIdx >= 0 && v(paren) === '(') {
        const pc = closeIdx(T, paren), endIdx = matchBlock(T, fnIdx);
        if (!ctx.handlers[name]) { ctx.handlers[name] = { a: pc + 1, b: endIdx, line: T[a].line }; used = true; }
        else ctx.notes.push({ line: T[a].line, kind: 'dup', text: 'The handler ' + name + ' is defined twice. The second one is kept as custom Lua.' });
      }
    }
    if (!used) ctx.custom.push((gap && gap.indexOf('--') === 0 ? gap + '\n' : '') + stmtSrc(ctx, st));
  });

  // Raw-body handlers
  const raw = { custom: ctx.custom.join('\n\n').replace(/^-- Custom Lua kept from the imported profile\n?/gm, '').trim(), OnLoad: '', OnUnload: '', HandleCommand: '' };
  RAW_HANDLERS.forEach(h => {
    const hd = ctx.handlers[h];
    if (!hd) return;
    const chunks = [];
    let pe = hd.a > 0 ? T[hd.a - 1].e : 0;
    splitStatements(T, hd.a, hd.b).forEach(st => {
      const gap = tidyGap(src.slice(pe, T[st.a].s));
      pe = T[st.b - 1].e;
      let e = st.b; if (T[e - 1].v === ';') e--;
      const v = i => T[i] && T[i].v;
      if (h === 'OnLoad' && v(st.a) === 'gSettings' && v(st.a + 1) === '.' && v(st.a + 3) === '=' && e - st.a === 5 && (v(st.a + 4) === 'true' || v(st.a + 4) === 'false')) {
        if (v(st.a + 2) === 'AllowAddSet') { ctx.settings.allowAddSet = v(st.a + 4) === 'true'; return; }
        if (v(st.a + 2) === 'AddSetBackup') { ctx.settings.addSetBackup = v(st.a + 4) === 'true'; return; }
      }
      chunks.push((gap && gap.indexOf('--') === 0 ? gap + '\n' : '') + stmtSrc(ctx, st));
    });
    raw[h] = chunks.join('\n');
    if (raw[h].trim() && h === 'HandleCommand') ctx.notes.push({ line: hd.line, kind: 'cmd', text: 'HandleCommand is kept as custom Lua. Commands added in Gear Studio are appended after it.' });
  });

  // Rule handlers
  const rules = [];
  GEN_ORDER.forEach(h => {
    const hd = ctx.handlers[h];
    if (!hd) return;
    let pending = null;
    const flush = () => {
      if (!pending) return;
      const r = newRule(h); r.name = pending.name; r.actions = pending.acts; rules.push(r); pending = null;
    };
    let pe = hd.a > 0 ? T[hd.a - 1].e : 0;
    splitStatements(T, hd.a, hd.b).forEach(st => {
      const gap = tidyGap(src.slice(pe, T[st.a].s));
      pe = T[st.b - 1].e;
      const comment = leadingComment(gap);
      let e = st.b; if (T[e - 1].v === ';') e--;
      const v = i => T[i] && T[i].v;
      if (v(st.a) === 'local' && T[st.a + 1] && T[st.a + 1].t === 'name' && v(st.a + 2) === '=' && v(st.a + 3) === 'gData' && v(st.a + 4) === '.' &&
          ['GetPlayer', 'GetAction', 'GetEnvironment'].indexOf(v(st.a + 5)) >= 0 && e - st.a === 8) return;
      if (T[st.a].t === 'kw' && T[st.a].v === 'if') {
        flush();
        parseIf(ctx, st.a).forEach((cl, idx) => {
          const r = newRule(h);
          r.name = idx === 0 ? comment : '';
          r.exclusive = idx > 0;
          r.when = cl.condA === null ? emptyGroup('AND') : condTree(ctx, cl.condA, cl.condB);
          r.actions = parseActions(ctx, cl.bodyA, cl.bodyB);
          rules.push(r);
        });
        return;
      }
      const act = parseSimpleAction(ctx, st);
      if (act) { if (!pending) pending = { name: comment, acts: [] }; pending.acts.push(act); return; }
      flush();
      const code = dedent((gap && gap.indexOf('--') === 0 ? gap + '\n' : '') + stmtSrc(ctx, st));
      rules.push(newRawRule(h, code));
      ctx.notes.push({ line: T[st.a].line, kind: 'raw', handler: h, text: 'A statement in ' + h + ' is not an if-rule or a simple equip call, so it is kept as a custom Lua block: ' + shorten(code) });
    });
    flush();
  });

  // Resolve set references by name
  const profile = newProfile(opts.name || opts.job || 'Imported', opts.job || '');
  profile.sets = ctx.sets;
  rules.forEach(r => (r.actions || []).forEach(a => {
    if (a.type === 'equipSet') { const s = findSet(profile, a.setName); if (s) a.setId = s.id; }
  }));
  profile.rules = rules;
  profile.names = ctx.names;
  profile.settings = ctx.settings;
  profile.raw = raw;
  const handlersFound = Object.keys(ctx.handlers);
  profile.importReport = {
    at: Date.now(), fileName: opts.fileName || '',
    sets: ctx.sets.length,
    rules: rules.filter(r => r.kind === 'rule').length,
    rawBlocks: rules.filter(r => r.kind === 'raw').length,
    customLines: (raw.custom || '').split('\n').filter(l => l.trim()).length,
    handlers: handlersFound,
    notes: ctx.notes.slice(0, 200),
    noteCount: ctx.notes.length,
  };
  return profile;
}

/* ------------------------------------------------------------------ */
/* Validation                                                          */
/* ------------------------------------------------------------------ */
function balanced(code) {
  try {
    const toks = lex(code);
    let depth = 0, br = 0;
    toks.forEach(t => {
      if (t.t === 'kw') {
        if (t.v === 'function' || t.v === 'if' || t.v === 'do' || t.v === 'repeat') depth++;
        else if (t.v === 'end' || t.v === 'until') depth--;
      } else if (t.t === 'op') {
        if (t.v === '(' || t.v === '[' || t.v === '{') br++;
        else if (t.v === ')' || t.v === ']' || t.v === '}') br--;
      }
    });
    if (depth > 0) return "is missing " + depth + " 'end'";
    if (depth < 0) return "has " + (-depth) + " extra 'end'";
    if (br !== 0) return 'has unmatched brackets';
    return '';
  } catch (e) { return e.message; }
}

function validate(profile) {
  const issues = [];
  const add = (sev, title, detail, ref) => issues.push({ sev, title, detail, ref: ref || {} });
  const customDefines = name => new RegExp('sets\\s*(\\.|\\[)\\s*[\'"]?' + String(name).split('.').join('[\'"\\]\\.\\[\\s]*').replace(/[^\w\\'"\]\.\[\s*]/g, '') ).test(profile.raw.custom || '');

  if (!profile.sets.length) add('warn', 'This profile has no gear sets yet', 'Rules can only equip sets that exist. Create a set on the Gear Sets tab first.', { tab: 'sets' });

  const seen = {};
  profile.sets.forEach(s => {
    const key = s.name.toLowerCase();
    if (!s.name.trim()) add('error', 'A gear set has no name', 'Give it a name so rules can refer to it.', { tab: 'sets', setId: s.id });
    if (seen[key]) add('error', 'Two gear sets are both called "' + s.name + '"', 'LuAshitacast matches set names without caring about upper or lower case, so the second one would never be found. Rename one.', { tab: 'sets', setId: s.id });
    seen[key] = true;
    if (s.name && !s.name.split('.').every(isIdent)) add('info', '"' + s.name + '" contains characters Lua treats specially', 'It still works, because Gear Studio writes it as sets["' + s.name + '"], but plain letters, numbers and underscores keep the file easier to read.', { tab: 'sets', setId: s.id });
    const filled = SLOTS.filter(sl => itemExpr(s.slots[sl]));
    if (!filled.length) add('warn', 'The set "' + s.name + '" is empty', 'An empty set equips nothing. Pick at least one item for it, or remove it if you do not need it.', { tab: 'sets', setId: s.id });
    ['Ring', 'Ear'].forEach(p => {
      const a = s.slots[p + '1'], b = s.slots[p + '2'];
      if (a && b && !a.raw && !b.raw && a.name && a.name.toLowerCase() === b.name.toLowerCase() && !(a.augments.length || b.augments.length))
        add('warn', 'The set "' + s.name + '" uses ' + a.name + ' in both ' + p + ' slots', 'You can only wear the same item twice if you own two copies. If you only have one, the second slot will stay empty.', { tab: 'sets', setId: s.id });
    });
    const main = s.slots.Main, sub = s.slots.Sub;
    if (main && sub && main.name && sub.name && main.name === sub.name) add('info', 'The set "' + s.name + '" puts ' + main.name + ' in both Main and Sub', 'That only works for a dual wield with two copies of the weapon.', { tab: 'sets', setId: s.id });
  });

  const usedSets = new Set();
  const names = {};
  profile.variables.forEach(v => {
    if (!isIdent(v.name)) add('error', 'The variable name "' + v.name + '" is not valid', 'Variable names must start with a letter or underscore and use only letters, numbers and underscores, and cannot be a Lua keyword such as "end".', { tab: 'profile' });
    if (names[v.name]) add('error', 'The variable "' + v.name + '" is defined twice', 'Each variable needs its own name.', { tab: 'profile' });
    names[v.name] = true;
    if (!v.options.length) add('error', 'The variable "' + v.name + '" has no options', 'Add at least one option, for example Normal, Acc.', { tab: 'profile' });
  });

  profile.rules.forEach((r, idx) => {
    const h = HANDLERS.find(x => x.id === r.handler);
    const where = { tab: 'rules', handler: r.handler, ruleId: r.id };
    const label = '"' + ruleTitle(r, profile) + '" in ' + (h ? h.label : r.handler);
    if (r.kind === 'raw') {
      const p = balanced(r.code || '');
      if (p) add('warn', 'A custom Lua block in ' + (h ? h.label : r.handler) + ' ' + p, 'Check the code for a missing "end" or bracket. The generated file would not load until this is fixed.', where);
      return;
    }
    const siblings = profile.rules.filter(x => x.handler === r.handler);
    const pos = siblings.indexOf(r);
    if (r.exclusive && pos === 0) add('info', 'The rule ' + label + ' is marked "Otherwise" but has no rule above it', 'It will behave like a normal rule.', where);
    if (r.exclusive && pos > 0 && siblings[pos - 1].kind === 'rule' && !groupExpr(siblings[pos - 1].when, profile, profile.names, true) && !siblings[pos - 1].exclusive)
      add('warn', 'The rule ' + label + ' can never be reached', 'The rule above it always applies, so an "Otherwise" rule below it never runs. Add a condition to the rule above or remove the Otherwise setting.', where);
    if (pos > 0 && r.exclusive) {
      let k = pos - 1;
      while (k >= 0 && siblings[k].kind === 'rule' && siblings[k].exclusive && siblings[k].enabled) {
        if (!groupExpr(siblings[k].when, profile, profile.names, true)) { add('warn', 'The rule ' + label + ' comes after an "Otherwise" rule with no condition', 'That rule always applies when reached, so this one can never run.', where); break; }
        k--;
      }
    }
    if (!r.actions.length) add('warn', 'The rule ' + label + ' does nothing', 'Add an action such as "Equip a gear set".', where);
    if (!(r.name || '').trim() && !groupExpr(r.when, profile, profile.names, true) && !r.exclusive && r.actions.length)
      void 0;
    (function walk(g) {
      (g.children || []).forEach(c => {
        if (isGroup(c)) { if (!c.children.length) add('info', 'The rule ' + label + ' has an empty condition group', 'Empty groups are ignored. Add a condition to it or remove it.', where); walk(c); return; }
        const spec = CONDS[c.kind];
        if (!spec) { add('error', 'The rule ' + label + ' has an unknown condition', 'Remove it and add the condition again.', where); return; }
        if (spec.needsAction && h && !h.action) add('error', 'The rule ' + label + ' checks the action, but there is no action here', 'In the Default handler LuAshitacast has no current action, so this check would cause an error in game. Move the rule to Precast, Midcast, Ability, Weaponskill, Item, Preshot or Midshot.', where);
        else if (spec.spellOnly && h && !h.spell) add('warn', 'The rule ' + label + ' checks a spell detail outside of a spell', 'Skill, element, type and MP cost only exist for spells. In ' + h.label + ' this check is never true.', where);
        if ((spec.type === 'enum' || spec.type === 'text' || spec.type === 'name' || spec.type === 'buff') && !String(c.value || '').trim()) add('warn', 'The rule ' + label + ' has a condition with no value', 'Fill in the value, otherwise the condition can never match.', where);
        if (spec.type === 'var') {
          const v = findVar(profile, c.varId);
          if (!v) add('error', 'The rule ' + label + ' refers to a variable that does not exist', 'Pick a variable on the Profile tab or remove this condition.', where);
          else if (v.options.length && v.options.indexOf(c.value) < 0) add('warn', 'The rule ' + label + ' compares ' + v.name + ' with "' + c.value + '"', 'That is not one of its options (' + v.options.join(', ') + ').', where);
        }
        if (spec.type === 'raw') {
          if (!(c.expr || '').trim()) add('warn', 'The rule ' + label + ' has an empty custom check', 'Enter a Lua expression or remove it.', where);
          else { const p = balanced(c.expr); if (p) add('warn', 'A custom check in ' + label + ' ' + p, 'Check the expression.', where); }
        }
      });
    })(r.when);
    r.actions.forEach(a => {
      if (a.type === 'equipSet') {
        const s = findSet(profile, a.setId);
        if (s) usedSets.add(s.id);
        else if (a.setName && customDefines(a.setName)) { /* defined in custom Lua */ }
        else add('error', 'The rule ' + label + ' equips a set that does not exist' + (a.setName ? ' ("' + a.setName + '")' : ''), 'The set may have been deleted or renamed. Choose another set in the rule, or create it on the Gear Sets tab.', where);
      } else if (a.type === 'equipSetVar') {
        const v = findVar(profile, a.varId);
        if (!v) add('error', 'The rule ' + label + ' uses a variable that does not exist', 'Choose a variable on the Profile tab first.', where);
        else v.options.forEach(o => {
          const s = findSet(profile, (a.prefix || '') + o);
          if (s) usedSets.add(s.id); else add('error', 'No gear set called "' + (a.prefix || '') + o + '"', 'The rule ' + label + ' builds a set name from the variable ' + v.name + ' (' + (a.prefix || '') + o + '), but that set is missing. Create it or remove the option.', where);
        });
      } else if (a.type === 'equipItem') {
        if (SLOTS.indexOf(a.slot) < 0) add('error', 'The rule ' + label + ' uses an unknown slot', 'Slots are ' + SLOTS.join(', ') + '.', where);
        if (!(a.item || '').trim()) add('warn', 'The rule ' + label + ' equips no item', 'Type an item name.', where);
      } else if (a.type === 'setVar') {
        if (!findVar(profile, a.varId)) add('error', 'The rule ' + label + ' changes a variable that does not exist', 'Pick a variable on the Profile tab.', where);
      } else if (a.type === 'rawLua') {
        const p = balanced(a.code || '');
        if (p) add('warn', 'Custom Lua in ' + label + ' ' + p, 'The generated file would not load until this is fixed.', where);
      }
    });
  });

  const cn = {};
  profile.commands.forEach(c => {
    const nm = (c.name || '').trim().toLowerCase();
    if (!nm) { add('warn', 'A command has no name', 'Type the word you will use after /lac fwd.', { tab: 'profile' }); return; }
    if (/\s/.test(nm)) add('error', 'The command "' + c.name + '" contains a space', 'Commands are a single word, used like /lac fwd ' + nm.split(/\s+/)[0] + '.', { tab: 'profile' });
    if (cn[nm]) add('error', 'The command "' + nm + '" is defined twice', 'Only the first one would run.', { tab: 'profile' });
    cn[nm] = true;
    if ((c.kind === 'cycle' || c.kind === 'set') && !findVar(profile, c.varId)) add('error', 'The command "' + nm + '" needs a variable', 'Choose which variable it changes.', { tab: 'profile' });
    if (c.kind === 'lock') { const s = findSet(profile, c.setId); if (!s) add('error', 'The command "' + nm + '" locks a set that does not exist', 'Choose a set.', { tab: 'profile' }); else usedSets.add(s.id); }
    if (c.kind === 'raw') { const p = balanced(c.code || ''); if (p) add('warn', 'The command "' + nm + '" ' + p, 'Check the Lua.', { tab: 'profile' }); }
  });

  ['custom', 'OnLoad', 'OnUnload', 'HandleCommand'].forEach(k => {
    const code = profile.raw[k] || '';
    if (!code.trim()) return;
    const p = balanced(code);
    if (p) add('warn', 'The custom Lua section "' + k + '" ' + p, 'The generated file would not load until this is fixed.', { tab: 'profile' });
  });
  const dupHandlers = GEN_ORDER.filter(h => new RegExp('profile\\s*\\.\\s*' + h + '\\s*=').test(profile.raw.custom || ''));
  dupHandlers.forEach(h => add('warn', 'Custom Lua also defines ' + h, 'Gear Studio generates this handler too, and the generated one is written last, so it wins.', { tab: 'profile' }));

  profile.sets.forEach(s => { if (!usedSets.has(s.id)) add('info', 'The set "' + s.name + '" is not used by any rule', 'It is still written to the file. You can equip it in game with /lac set ' + s.name + '.', { tab: 'sets', setId: s.id }); });

  const rank = { error: 0, warn: 1, info: 2 };
  issues.sort((a, b) => rank[a.sev] - rank[b.sev]);
  return issues;
}

/* ------------------------------------------------------------------ */
/* Project (de)serialisation                                           */
/* ------------------------------------------------------------------ */
function normaliseProject(p) {
  if (!p || !Array.isArray(p.profiles)) throw new Error('This file is not an Ashita Gear Studio project (no profiles found).');
  const out = { schema: 1, name: String(p.name || 'My Gear Project'), profiles: [] };
  p.profiles.forEach(src => {
    const pr = newProfile(src.name, src.job);
    Object.assign(pr, clone(src));
    pr.settings = Object.assign({ allowAddSet: true, addSetBackup: true }, src.settings || {});
    pr.names = Object.assign({ player: 'player', action: 'action', environment: 'environment' }, src.names || {});
    pr.raw = Object.assign({ custom: '', OnLoad: '', OnUnload: '', HandleCommand: '' }, src.raw || {});
    pr.sets = pr.sets || []; pr.variables = pr.variables || []; pr.rules = pr.rules || []; pr.commands = pr.commands || [];
    pr.sets.forEach(s => { s.slots = s.slots || {}; s.extras = s.extras || []; s.note = s.note || ''; });
    out.profiles.push(pr);
  });
  if (!out.profiles.length) out.profiles.push(newProfile('Profile', ''));
  return out;
}

/* ------------------------------------------------------------------ */
/* Syntax highlighting for the preview                                 */
/* ------------------------------------------------------------------ */
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function highlightLua(src) {
  let out = '', i = 0;
  const n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === '-' && src[i + 1] === '-') {
      let j = i;
      const lv = longLevel(src, i + 2);
      if (lv >= 0) j = longEnd(src, i + 2 + lv + 2, lv); else { while (j < n && src[j] !== '\n') j++; }
      out += '<span class="lc">' + esc(src.slice(i, j)) + '</span>'; i = j; continue;

      '<div class="used-in">' + (by.length ? 'Used by: ' + by.map(r => '<button class="chip" data-a="goto-rule" data-id="' + r.id + '">' + esc(C.ruleTitle(r, p)) + ' in ' + esc((C.HANDLERS.find(h => h.id === r.handler) || {}).label || r.handler) + '</button>').join('') : 'No rule uses this set yet. Add one on the Rules tab, or equip it in game with <code>/lac set ' + esc(s.name) + '</code>.') + '</div>' +

function resultsHtml() {

}

      '<div class="field" style="align-content:end"><span>Other fields</span><span class="hint small">' + ((it.extras || []).length ? it.extras.map(e => esc(e.k + ' = ' + e.raw)).join(', ') : 'none') + '</span></div></div>' +
      '<label class="field">Augments, one per line<textarea rows="3" data-bind="' + b + 'augments" placeholder="Example: DEX+5">' + esc((it.augments || []).join('\n')) + '</textarea></label>' +

    '<label class="field">Search or type an item<input type="text" id="itemsearch" autocomplete="off" data-search="1" data-enter="1" placeholder="Search the sample list, or type any name" value="' + esc(ui.search) + '"></label>' +

/* ---------------- rules tab ---------------- */
function kindSelect(c, r, path) {
  const groups = {};
  Object.keys(C.CONDS).forEach(k => { const g = C.CONDS[k].group; (groups[g] = groups[g] || []).push(k); });
  return '<select aria-label="Condition type" data-c="cond-kind" data-rule="' + r.id + '" data-path="' + path + '">' +
    Object.keys(groups).map(g => '<optgroup label="' + g + '">' + groups[g].map(k => '<option value="' + k + '"' + (k === c.kind ? ' selected' : '') + '>' + esc(C.CONDS[k].label) + '</option>').join('') + '</optgroup>').join('') + '</select>';
}
function condRow(r, path, c, p) {
  const spec = C.CONDS[c.kind] || C.CONDS['player.status'];
  const b = 'cond|' + r.id + '|' + path + '|';
  const rm = '<button class="btn ghost icon-btn" aria-label="Remove condition" data-a="cond-del" data-rule="' + r.id + '" data-path="' + path + '">✕</button>';
  const opSel = () => '<select aria-label="Operator" data-bind="' + b + 'op" data-render="1">' + spec.ops.map(o => '<option value="' + o[0] + '"' + (o[0] === c.op ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>';
  switch (spec.type) {
    case 'enum': {
      const opts = spec.options.indexOf(c.value) < 0 ? [c.value].concat(spec.options) : spec.options;
      return '<div class="crow">' + kindSelect(c, r, path) + opSel() + '<select aria-label="Value" data-bind="' + b + 'value" data-render="1">' + opts.map(o => '<option' + (o === c.value ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>' + rm + '</div>';
    }
    case 'num':
      return '<div class="crow">' + kindSelect(c, r, path) + opSel() + '<input type="number" aria-label="Value" data-bind="' + b + 'value" value="' + esc(c.value) + '">' + rm + '</div>';
    case 'text':
      return '<div class="crow">' + kindSelect(c, r, path) + opSel() + '<input type="text" aria-label="Value" data-bind="' + b + 'value" value="' + esc(c.value) + '">' + rm + '</div>';
    case 'name': {
      const dl = r.handler === 'HandleAbility' ? 'dl-abilities' : r.handler === 'HandleWeaponskill' ? 'dl-weaponskills' : 'dl-spells';
      return '<div class="crow">' + kindSelect(c, r, path) + opSel() + '<input type="text" list="' + dl + '" aria-label="' + (c.op === 'oneof' ? 'Names separated by commas' : 'Name') + '" placeholder="' + (c.op === 'oneof' ? 'Cure, Cure II' : 'Cure') + '" data-bind="' + b + 'value" value="' + esc(c.value) + '">' + rm + '</div>';
    }
    case 'bool': case 'pet':
      return '<div class="crow two">' + kindSelect(c, r, path) + opSel() + rm + '</div>';
    case 'buff':
      return '<div class="crow">' + kindSelect(c, r, path) + '<input type="text" list="dl-buffs" aria-label="Status effect" placeholder="Haste" data-bind="' + b + 'value" value="' + esc(c.value) + '">' + opSel() + rm + '</div>';
    case 'var': {
      const v = C.findVar(p, c.varId);
      const vsel = '<select aria-label="Variable" data-bind="' + b + 'varId" data-render="1"><option value="">Choose…</option>' + p.variables.map(x => '<option value="' + x.id + '"' + (x.id === c.varId ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') + '</select>';
      const vals = v ? (v.options.indexOf(c.value) < 0 && c.value ? [c.value].concat(v.options) : v.options) : [];
      const valSel = '<select aria-label="Value" data-bind="' + b + 'value" data-render="1">' + (vals.indexOf(c.value) < 0 ? '<option value="">Choose…</option>' : '') + vals.map(o => '<option' + (o === c.value ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
      return '<div class="crow">' + kindSelect(c, r, path) + '<div class="pair">' + vsel + opSel() + '</div>' + valSel + rm + '</div>';
    }
    case 'raw':
      return '<div class="crow rawc">' + kindSelect(c, r, path) + '<input type="text" style="font-family:var(--font-mono);font-size:13px" aria-label="Lua expression" placeholder="TPMode == \'Acc\'" data-bind="' + b + 'expr" value="' + esc(c.expr || '') + '">' + rm + '</div>';
  }
  return '';
}
function groupHtml(r, path, g, p, depth) {
  const gb = 'grp|' + r.id + '|' + path;
  const kids = g.children.map((ch, i) => {
    const cp = path === '' ? String(i) : path + '.' + i;
    return C.isGroup(ch) ? groupHtml(r, cp, ch, p, depth + 1) : condRow(r, cp, ch, p);
  }).join('');
  const multi = g.children.length > 1;
  const head = '<div class="group-head">' +
    (multi || path !== '' ? '<button class="logic ' + (g.op === 'OR' ? 'or' : 'and') + '" data-a="grp-toggle" data-rule="' + r.id + '" data-path="' + path + '" title="Switch between all and any">' + (g.op === 'OR' ? 'ANY of these' : 'ALL of these') + '</button>' : '') +
    (path !== '' ? '<button class="btn ghost small" data-a="grp-del" data-rule="' + r.id + '" data-path="' + path + '">Remove group</button>' : '') + '</div>';
  const empty = !g.children.length ? '<p class="hint small">' + (path === '' ? 'No conditions, so this rule always applies.' : 'Empty group.') + '</p>' : '';
  const add = '<div class="add-row"><button class="btn small" data-a="cond-add" data-rule="' + r.id + '" data-path="' + path + '">+ Condition</button>' + (depth < 2 ? '<button class="btn small ghost" data-a="grp-add" data-rule="' + r.id + '" data-path="' + path + '">+ Group</button>' : '') + '</div>';
  return '<div class="group">' + head + kids + empty + add + '</div>';
}
function actionRow(r, i, a, p) {
  const b = 'act|' + r.id + '|' + i + '|';
  const typeSel = '<select aria-label="Action type" data-c="act-type" data-rule="' + r.id + '" data-idx="' + i + '">' + C.ACTION_TYPES.map(t => '<option value="' + t[0] + '"' + (t[0] === a.type ? ' selected' : '') + '>' + t[1] + '</option>').join('') + '</select>';
  const rm = '<button class="btn ghost icon-btn" aria-label="Remove action" data-a="act-del" data-rule="' + r.id + '" data-idx="' + i + '">✕</button>';
  const varSel = key => '<select aria-label="Variable" data-bind="' + b + key + '" data-render="1"><option value="">Choose a variable…</option>' + p.variables.map(x => '<option value="' + x.id + '"' + (x.id === a[key] ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') + '</select>';
  let f = '';
  switch (a.type) {
    case 'equipSet': {
      const found = C.findSet(p, a.setId);
      f = '<select aria-label="Gear set" data-bind="' + b + 'setId" data-render="1">' + (!found ? '<option value="">' + (a.setName ? 'Missing: ' + esc(a.setName) : 'Choose a set…') + '</option>' : '') + p.sets.map(s => '<option value="' + s.id + '"' + (found && s.id === found.id ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('') + '</select>';
      break;
    }
    case 'equipSetVar':
      f = '<div class="pair"><input type="text" aria-label="Set name prefix" placeholder="Prefix, e.g. TP_" data-bind="' + b + 'prefix" value="' + esc(a.prefix || '') + '">' + varSel('varId') + '</div><p class="hint small">Equips the set named prefix + the variable’s current value, for example TP_Acc.</p>';
      break;
    case 'equipItem':
      f = '<div class="pair"><select aria-label="Slot" data-bind="' + b + 'slot" data-render="1">' + C.SLOTS.map(s => '<option' + (s === a.slot ? ' selected' : '') + '>' + s + '</option>').join('') + '</select><input type="text" aria-label="Item" placeholder="Item name" data-bind="' + b + 'item" value="' + esc(a.item || '') + '"></div>';
      break;
    case 'message':
      f = '<input type="text" aria-label="Message" placeholder="Text shown in the chat log" data-bind="' + b + 'text" value="' + esc(a.text || '') + '">';
      break;
    case 'setVar': {
      const v = C.findVar(p, a.varId);
      f = '<div class="pair">' + varSel('varId') + (v ? '<select aria-label="Value" data-bind="' + b + 'value" data-render="1">' + (v.options.indexOf(a.value) < 0 ? '<option value="">Choose…</option>' : '') + v.options.map(o => '<option' + (o === a.value ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>' : '') + '</div>';
      break;
    }
    case 'rawLua':
      f = '<textarea rows="3" aria-label="Lua code" placeholder="Lua statements" data-bind="' + b + 'code">' + esc(a.code || '') + '</textarea>';
      break;
  }
  return '<div class="arow">' + typeSel + '<div class="stack">' + f + '</div>' + rm + '</div>';
}
function engHtml(r, p) { return '<b>Plain English:</b> ' + esc(C.describeRule(r, p)); }
function ruleCard(r, n, siblings, p) {
  const pos = siblings.indexOf(r);
  const head = '<div class="rule-head"><span class="num" title="Rules run top to bottom">' + (n + 1) + '</span>' +
    '<label class="toggle" title="Switch the rule off without deleting it"><input type="checkbox" data-bind="rule|' + r.id + '|enabled" data-render="1"' + (r.enabled ? ' checked' : '') + '>On</label>' +
    '<input type="text" class="rname" aria-label="Rule name" placeholder="' + esc(C.ruleTitle(Object.assign({}, r, { name: '' }), p)) + '" data-bind="rule|' + r.id + '|name" value="' + esc(r.name) + '">' +
    (r.kind === 'rule' && pos > 0 ? '<label class="toggle" title="Generates an elseif: this rule is only checked when the rule above did not match"><input type="checkbox" data-bind="rule|' + r.id + '|exclusive" data-render="1"' + (r.exclusive ? ' checked' : '') + '>Otherwise</label>' : '') +
    '<button class="btn ghost icon-btn" aria-label="Move up" data-a="rule-up" data-id="' + r.id + '"' + (pos === 0 ? ' disabled' : '') + '>↑</button>' +
    '<button class="btn ghost icon-btn" aria-label="Move down" data-a="rule-down" data-id="' + r.id + '"' + (pos === siblings.length - 1 ? ' disabled' : '') + '>↓</button>' +
    '<button class="btn ghost small" data-a="rule-dup" data-id="' + r.id + '">Duplicate</button>' + delBtn('rule:' + r.id, 'Delete') + '</div>';
  let body;
  if (r.kind === 'raw') {
    body = '<div class="rule-body" style="grid-template-columns:1fr"><div><p class="raw-flag">Custom Lua block</p><p class="hint small" style="margin-bottom:8px">This code could not be shown as a visual rule. It is written to the file exactly as you see it.</p><textarea rows="' + Math.min(14, Math.max(4, (r.code || '').split('\n').length + 1)) + '" aria-label="Lua code" data-bind="rule|' + r.id + '|code">' + esc(r.code || '') + '</textarea></div></div>';
  } else {
    body = '<div class="rule-body"><div><div class="col-title">When</div>' + groupHtml(r, '', r.when, p, 0) + '</div>' +
      '<div><div class="col-title">Then</div><div class="actions-list">' + r.actions.map((a, i) => actionRow(r, i, a, p)).join('') + '<div class="add-row"><button class="btn small" data-a="act-add" data-rule="' + r.id + '">+ Action</button></div></div></div>' +
      '<div class="english" data-eng="' + r.id + '">' + engHtml(r, p) + '</div></div>';
  }
  return '<article class="win rule' + (r.enabled ? '' : ' off') + (ui.flash === r.id ? ' flash' : '') + '" id="rule-' + r.id + '">' + head + body + '</article>';
}
function rulesTab() {
  const p = prof();
  const h = C.HANDLERS.find(x => x.id === ui.handler);
  const pills = C.HANDLERS.map(x => {
    const n = p.rules.filter(r => r.handler === x.id).length;
    return '<button class="hpill" role="tab" data-a="handler" data-id="' + x.id + '" aria-selected="' + (x.id === ui.handler) + '">' + x.label + (n ? '<span class="badge">' + n + '</span>' : '') + '</button>';
  }).join('');
  const rules = p.rules.filter(r => r.handler === ui.handler);
  const list = rules.length ? rules.map((r, i) => ruleCard(r, i, rules, p)).join('') :
    '<div class="empty-state">No rules in ' + h.label + ' yet.<br>A rule says “when these things are true, equip this set”.<br><br><button class="btn primary" data-a="rule-add">+ Add a rule</button></div>';
  return '<div class="handler-tabs" role="tablist" aria-label="When rules run">' + pills + '</div>' +
    '<div class="handler-info"><b>' + h.label + '</b> <code>profile.' + h.id + '</code><br>' + esc(h.blurb) + ' Rules run top to bottom. When two rules fill the same slot, the later one wins, unless you tick “Otherwise” to make a rule apply only when the one above did not match.' + (h.action ? '' : ' There is no current action here, so spell and ability checks are not available.') + '</div>' +
